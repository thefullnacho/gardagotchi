; Gardagotchi firmware: Waveshare ESP32-S3-LCD-1.28 (non-touch)
;
;   pio run -e frog -t upload && pio device monitor     the frog, driven by the mood engine
;   pio run -e calibrate -t upload && pio device monitor soil/light logging week
;   pio test -e native                                   mood tests, on this computer
;
; Chip: ESP32-S3R2 (2 MB PSRAM) + 16 MB flash. USB goes through a CH343P
; USB-serial chip, so Serial is the hardware UART, not native USB.

[platformio]
default_envs = frog

[esp32]
platform = espressif32          ; pioarduino build already on this machine (Arduino core 3.3.1)
board = esp32-s3-devkitc1-n16r2
framework = arduino
board_upload.flash_size = 16MB  ; the stock board file says 8MB
board_build.partitions = default_16MB.csv  ; two app slots (OTA later) + 3.4 MB for the log
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    adafruit/Adafruit seesaw Library@^1.7.9
    claws/BH1750@^1.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:frog]
extends = esp32

[env:calibrate]
extends = esp32
build_flags = ${esp32.build_flags} -DGG_CALIBRATE

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
